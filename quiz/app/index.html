<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS329Z Harness Oral Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style id="page-style">
/* Layout: an exam console. A sticky question rail beside one working column; each grade is drawn as a <tool_result> block, the same shape the harness writes. */
:root {
  --bg: #f5f4f5;
  --surface: #ffffff;
  --sunken: #efedee;
  --fg: #1c191b;
  --muted: #665e63;
  --line: #dcd6d9;
  --accent: #8c1515;
  --accent-ink: #ffffff;
  --accent-soft: #f6e8e8;
  --good: #1b7448;
  --fair: #8f5f00;
  --weak: #b03d1a;
  --code: #f0ecee;
  --f-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141113; --surface: #1c181b; --sunken: #231e21; --fg: #ece7ea; --muted: #a69da2; --line: #362f33;
    --accent: #e2676d; --accent-ink: #1a0d0e; --accent-soft: #3a2124;
    --good: #5cc795; --fair: #dfb24a; --weak: #f0895c; --code: #241f22;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141113; --surface: #1c181b; --sunken: #231e21; --fg: #ece7ea; --muted: #a69da2; --line: #362f33;
  --accent: #e2676d; --accent-ink: #1a0d0e; --accent-soft: #3a2124;
  --good: #5cc795; --fair: #dfb24a; --weak: #f0895c; --code: #241f22;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--f-body); }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: 0.005em; }
code, kbd, pre, .mono { font-family: var(--f-mono); font-size: 0.86em; }
code { background: var(--code); padding: 0.08em 0.35em; border-radius: 4px; overflow-wrap: anywhere; }
pre { background: var(--code); padding: 10px 12px; border-radius: var(--r); overflow-x: auto; margin: 0; }
pre code { background: none; padding: 0; }
a { color: var(--accent); }
button, textarea, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.shell {
  max-width: 1180px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.topbar { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-bottom: 14px; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand h1 { font-size: 20px; font-weight: 700; }
.brand .sub { color: var(--muted); font-size: 13px; }
.status-line { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); white-space: nowrap; }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.pill.on .dot { background: var(--good); }
.pill.off .dot { background: var(--weak); }

.layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 28px; align-items: start; }
@media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); gap: 16px; } }

/* rail */
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); display: grid; gap: 10px; }
.rail-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.rail ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.rail-item { width: 100%; display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 8px; align-items: center; text-align: left; background: none; border: 0; border-radius: var(--r); padding: 7px 8px; cursor: pointer; }
.rail-item:hover { background: var(--sunken); }
.rail-item[aria-current="true"] { background: var(--surface); box-shadow: inset 2px 0 0 var(--accent), 0 0 0 1px var(--line); }
.rail-item .num { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.rail-item .t { font-size: 13.5px; line-height: 1.3; overflow-wrap: anywhere; }
.rail-item .tag { font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); display: block; }
.rail-foot { display: grid; gap: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
@media (max-width: 860px) {
  .rail { position: static; }
  .rail ol { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
  .rail-item { width: auto; min-width: 150px; grid-template-columns: 18px minmax(0, 1fr) auto; background: var(--surface); box-shadow: 0 0 0 1px var(--line); }
  .rail-foot { grid-template-columns: 1fr 1fr; }
}

.chip { font-family: var(--f-mono); font-size: 11.5px; padding: 1px 7px; border-radius: 4px; border: 1px solid currentColor; white-space: nowrap; font-variant-numeric: tabular-nums; }
.s5, .s4 { color: var(--good); }
.s3 { color: var(--fair); }
.s2, .s1 { color: var(--weak); }
.s0 { color: var(--muted); border-style: dashed; }
.spin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin 0.9s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; border-top-color: var(--line); border-color: var(--accent); } }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 8px 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 500; font-size: 14px; line-height: 1.2; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: none; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--fg); background: var(--sunken); }
.btn.small { padding: 4px 10px; font-size: 13px; }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; filter: none; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.spacer { flex: 1; }

/* main column */
.main { min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; color: var(--accent); letter-spacing: 0.02em; }
.qhead { display: grid; gap: 8px; }
.qhead h2 { font-size: 26px; font-weight: 600; line-height: 1.2; }
.ask { font-size: 17px; line-height: 1.55; max-width: 68ch; }
.ask p { margin: 0 0 8px; }
details.hint { max-width: 68ch; font-size: 14px; color: var(--muted); }
details.hint summary { cursor: pointer; width: fit-content; }
details.hint ul { margin: 6px 0 0; padding-left: 20px; }
details.hint.sample { max-width: none; }
details.hint.sample > .md { color: var(--fg); font-size: 15px; margin-top: 4px; }
details.context { max-width: 72ch; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); font-size: 14px; }
details.context summary { cursor: pointer; padding: 8px 12px; font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
details.context[open] summary { border-bottom: 1px solid var(--line); }
.ctx { display: grid; gap: 14px; padding: 12px 14px 14px; line-height: 1.5; }
.ctx-h { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-bottom: 4px; }
.ctx ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.ctx p { margin: 0; }
.ctx-refs { display: flex; flex-wrap: wrap; gap: 1px 12px; margin-top: 2px; font-size: 12.5px; color: var(--muted); }
.ctx-refs span { min-width: 0; overflow-wrap: anywhere; }
.ctx-refs code { font-size: 11.5px; }
a.ref { text-decoration: none; }
a.ref:hover { text-decoration: underline; }
a.ref code { color: var(--accent); }
.field { display: grid; gap: 6px; }
.field label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.field label .aux { text-transform: none; letter-spacing: 0; font-weight: 400; font-family: var(--f-mono); }
textarea { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; resize: vertical; line-height: 1.5; }
textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
textarea.refs { font-family: var(--f-mono); font-size: 13px; }
.note { font-size: 13px; color: var(--muted); }
.warn { font-size: 13.5px; padding: 10px 12px; border-radius: var(--r); background: var(--accent-soft); }

/* grader result */
.result { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; }
.result-tag { font-family: var(--f-mono); font-size: 12px; color: var(--muted); padding: 7px 14px; background: var(--sunken); border-bottom: 1px solid var(--line); overflow-x: auto; white-space: nowrap; }
.result-tag b { color: var(--accent); font-weight: 500; }
.result-tag.end { border-bottom: 0; border-top: 1px solid var(--line); }
.result-body { padding: 16px 16px 18px; display: grid; gap: 16px; }
.score-row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.big { font-family: var(--f-display); font-size: 40px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.big small { font-size: 18px; color: var(--muted); font-weight: 500; }
.pips { display: flex; gap: 4px; }
.pips i { width: 18px; height: 8px; border-radius: 2px; background: var(--sunken); box-shadow: inset 0 0 0 1px var(--line); }
.pips i.on { background: currentColor; box-shadow: none; }
.verdict { flex: 1 1 260px; font-size: 16px; font-weight: 500; min-width: 0; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.block h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 6px; font-family: var(--f-body); font-weight: 600; }
.block ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 600; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
td.mono { white-space: nowrap; }
.st { font-family: var(--f-mono); font-size: 11.5px; padding: 0 6px; border-radius: 3px; border: 1px solid currentColor; }
.st.correct { color: var(--good); }
.st.close { color: var(--fair); }
.st.wrong, .st.unverifiable { color: var(--weak); }
details.model { border-top: 1px dashed var(--line); padding-top: 12px; }
details.model summary { cursor: pointer; font-weight: 600; }
details.model .md { margin-top: 8px; }
.activity { font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); display: grid; gap: 3px; }
.activity .live { display: flex; gap: 8px; align-items: center; color: var(--fg); }
.grade-area { display: grid; gap: 14px; min-width: 0; }
.history { font-size: 13.5px; }
.history summary { cursor: pointer; color: var(--muted); }
.history .past { border-left: 2px solid var(--line); padding: 4px 0 4px 12px; margin-top: 8px; }
.history .past > summary { color: var(--fg); }
.history .past[open] > summary { margin-bottom: 10px; }
.history .past > div { display: grid; gap: 12px; }
.flash { box-shadow: 0 0 0 2px var(--accent); border-radius: var(--r); }

/* follow-up thread */
.thread { display: grid; gap: 10px; }
.thread h3 { font-size: 15px; }
.msg { max-width: 70ch; padding: 10px 12px; border-radius: var(--r); font-size: 14.5px; min-width: 0; }
.msg.user { background: var(--accent-soft); justify-self: end; }
.msg.assistant { background: var(--surface); border: 1px solid var(--line); }
.msg .who { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 2px; }
.md p { margin: 0 0 8px; }
.md p:last-child { margin-bottom: 0; }
.md ul, .md ol { margin: 0 0 8px; padding-left: 20px; }
.md pre { margin: 6px 0 8px; }
.compose { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: end; }
.compose textarea { min-height: 44px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip-btn { font-size: 13px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.chip-btn:hover { border-color: var(--accent); color: var(--accent); }

/* start + summary */
.hero { display: grid; gap: 12px; max-width: 70ch; }
.hero h2 { font-size: 34px; font-weight: 700; line-height: 1.12; }
.hero p { margin: 0; color: var(--muted); font-size: 16px; }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; max-width: 760px; }
.mode { text-align: left; display: grid; gap: 6px; padding: 16px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.mode:hover { border-color: var(--accent); }
.mode strong { font-family: var(--f-display); font-size: 19px; font-weight: 600; }
.mode span { color: var(--muted); font-size: 14px; }
.toc { display: grid; gap: 0; max-width: 760px; border-top: 1px solid var(--line); }
.toc-row { display: grid; grid-template-columns: 20px 24px minmax(0, 1fr) auto; gap: 4px 10px; padding: 8px 2px; border-bottom: 1px solid var(--line); font-size: 14px; align-items: baseline; }
.toc-row .mono { color: var(--muted); font-size: 12px; }
.toc-row input { margin: 0; accent-color: var(--accent); align-self: center; }
.toc-row label { cursor: pointer; min-width: 0; overflow-wrap: anywhere; }
.toc-answers { grid-column: 3 / -1; display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; font-size: 12.5px; color: var(--muted); }
.ans { display: inline-flex; gap: 5px; align-items: center; padding: 1px 6px 1px 1px; border-radius: 4px; color: var(--muted); text-decoration: none; white-space: nowrap; }
.ans:hover { color: var(--fg); background: var(--sunken); }
.toc-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; max-width: 760px; }
@media (max-width: 560px) { .toc-row .toc-tag { grid-column: 3 / -1; } }
.section-h { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-family: var(--f-body); font-weight: 600; }
.attempts { display: grid; gap: 8px; max-width: 760px; }
.attempt { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.attempt .meta { font-size: 13px; color: var(--muted); }
.save-steps { display: grid; gap: 10px; max-width: 72ch; margin: 0; padding-left: 20px; }
.copyline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.copyline code { padding: 4px 8px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: var(--r); font-size: 14px; z-index: 20; max-width: calc(100% - 32px); }
.verdict { color: var(--fg); }
.report .main { max-width: 920px; margin: 0 auto; }
.report-q { display: grid; gap: 12px; padding-block: 24px; border-top: 1px solid var(--line); }
.report-q h3 { font-size: 15px; margin-top: 6px; }
blockquote.answer { margin: 0; padding: 10px 14px; border-left: 3px solid var(--accent); background: var(--surface); border-radius: 0 var(--r) var(--r) 0; max-width: 72ch; }
.samples-nav { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13.5px; max-width: 760px; }
.samples-nav a { text-decoration: none; }
.samples-nav a:hover { text-decoration: underline; }
.sample-card { display: grid; gap: 10px; padding-top: 20px; border-top: 1px solid var(--line); scroll-margin-top: 12px; }
.sample-card h2 { font-size: 22px; font-weight: 600; line-height: 1.2; }
.sample-card .ask { font-size: 15.5px; color: var(--muted); }
.sample-card > .md, details.sample > .md { max-width: 72ch; }
details.sample { display: grid; gap: 10px; }
details.sample[open] > summary { margin-bottom: 4px; }
.toc-sample { font-size: 12.5px; color: var(--muted); text-decoration: none; white-space: nowrap; }
.toc-sample:hover { color: var(--fg); text-decoration: underline; }
.confirm > span { font-size: 13.5px; }
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <h1>CS329Z Harness Oral Prep</h1>
      <span class="sub">Assignment 1 · practice for the 10-minute oral quiz</span>
    </div>
    <div class="status-line">
      <span class="pill" id="pill-grader"><span class="dot"></span><span>Grader: connecting</span></span>
      <span class="pill" id="pill-sync"><span class="dot"></span><span>Autosave: quiz/.attempts</span></span>
    </div>
  </header>
  <div id="app"></div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";

const FONT_LINK = '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">';

let QUESTIONS = [], QBY = {}, CHIPS = [], INFO = null, HANDOUT = "cs329z_assignment1_harness.pdf";
const state = { view: "start", attempt: null, items: {}, current: 0 };
const inflight = {}; // qid -> {ctl, kind, log, text}
const timers = {}; // qid -> {start, base}

// ------------------------------------------------------------------ utils ----

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function now() { return new Date().toISOString(); }
function fmtDate(iso) {
  try { return new Date(iso).toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }); } catch { return iso; }
}
function fmtSecs(s) { s = Math.max(0, Math.round(s || 0)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }
function fmtCost(c) { return typeof c === "number" ? `$${c.toFixed(2)}` : ""; }
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, 3200);
}
function scoreClass(n) { return n ? `s${n}` : "s0"; }
function lastSub(item) { const s = item?.submissions; return s && s.length ? s[s.length - 1] : null; }
function lastGrade(item) { return lastSub(item)?.grade || null; }
function itemFor(qid) {
  if (!state.items[qid]) state.items[qid] = { qid, answer: "", refs: "", submissions: [], draftSeconds: 0 };
  return state.items[qid];
}
function errMsg(e) {
  if (e instanceof TypeError) return "The quiz server is not answering. Start it with: python3 quiz/app/server.py";
  return String(e?.message || e || "Something went wrong.");
}
function modeLabel(mode) { return { quick: "Quick round", retake: "Retake", custom: "Custom quiz" }[mode] || "Full practice"; }

// Handout references. The app serves the PDF at /handout.pdf; a saved report
// in quiz/quizN/ links to the copy in the repository root.
function pagesLabel(p) { return p.length > 1 ? `pp. ${p[0]}–${p[1]}` : `p. ${p[0]}`; }
function handoutHref(page, report) { return `${report ? "../../" + HANDOUT : "/handout.pdf"}#page=${page}`; }
function contextSummary(q) { const s = q.context.sources[0]; return `${s.label.split(":")[0]} · ${pagesLabel(s.pages)}`; }
// Code references: "path", "path:12" or "path:12-30", where path is a file or a
// folder ("data/docs/") in the repository; a bare name such as session.py stands
// for the one file it names. Only paths that exist get a link. In the app a link
// opens the server's code viewer (code.html); reportLinks() points the links of a
// saved report at your editor instead, since the report is a file in quiz/quizN/.
const REF_TOKEN = /^((?:[\w.-]+\/)*[\w.-]+\.(?:py|md|toml|json|jsonl|txt|ya?ml|cfg|ini|lock|pdf)|(?:[\w.-]+\/)+)(?::(\d+)(?:-(\d+))?)?$/;
const BARE_REF = /(^|[\s(\[,;])((?:[\w.-]+\/)+[\w.-]+\.[a-z]+(?::\d+(?:-\d+)?)?)(?=$|[\s)\],;.:!?&])/g;
let FILES = new Set(), DIRS = new Set();
function setFiles(files) {
  FILES = new Set(files);
  DIRS = new Set(files.flatMap(f => { const parts = f.split("/"); return parts.slice(1).map((_, i) => parts.slice(0, i + 1).join("/") + "/"); }));
}
function leadingRef(s) { return String(s).match(/^\s*([\w./-]+(?::\d+(?:-\d+)?)?)/)?.[1] || ""; }
function parseRef(at) {
  const m = String(at).match(REF_TOKEN); if (!m) return null;
  const pool = m[1].endsWith("/") ? DIRS : FILES;
  let path = pool.has(m[1]) ? m[1] : null;
  if (!path) { const hits = [...pool].filter(p => ("/" + p).endsWith("/" + m[1])); if (hits.length === 1) path = hits[0]; }
  return path && { path, a: m[2], b: m[3] };
}
function codeHref(r, target = "app") {
  const p = encodeURI(r.path);
  if (target === "md") return `../../${p}${r.a ? `#L${r.a}${r.b ? "-L" + r.b : ""}` : ""}`;
  if (target === "report") return /(\/|\.pdf)$/i.test(r.path) || !INFO?.editor ? `../../${p}`
    : `${INFO.editor}://file${encodeURI(INFO.repo + "/" + r.path)}${r.a ? ":" + r.a : ""}`;
  if (/\.pdf$/i.test(r.path)) return `/raw/${p}`;
  return `/code/${p}${r.a ? `?lines=${r.a}${r.b ? "-" + r.b : ""}#L${r.a}` : ""}`;
}
function refLink(at, inner = `<code>${esc(at)}</code>`) {
  const r = parseRef(at); if (!r) return inner;
  const ref = r.path + (r.a ? `:${r.a}${r.b ? "-" + r.b : ""}` : "");
  return `<a class="ref" data-ref="${esc(ref)}" href="${esc(codeHref(r))}" target="_blank" rel="noopener" title="${esc(ref)}">${inner}</a>`;
}
function reportLinks(html) {
  return html.replace(/<a class="ref" data-ref="([^"]*)"[^>]*>/g, (_, ref) => {
    const href = codeHref(parseRef(ref), "report");
    return `<a class="ref" href="${esc(href)}"${href.startsWith("../") ? ' target="_blank" rel="noopener"' : ""}>`;
  });
}
// The code a student pointed to, one reference per line, each linked when it names a file.
function refsBlock(text) {
  return `<pre><code>${String(text).split("\n").map(l => {
    const at = leadingRef(l), i = l.indexOf(at);
    return at ? esc(l.slice(0, i)) + refLink(at, esc(at)) + esc(l.slice(i + at.length)) : esc(l);
  }).join("\n")}</code></pre>`;
}

// A context item is {text, refs}; a ref is "path:lines label" (lines optional).
function splitRef(r) { const m = String(r).match(/^(\S+)\s*(.*)$/); return m ? [m[1], m[2]] : [String(r), ""]; }
function refsHTML(refs) {
  if (!refs?.length) return "";
  return `<div class="ctx-refs">${refs.map(r => { const [at, label] = splitRef(r); return `<span>${refLink(at)}${label ? " " + esc(label) : ""}</span>`; }).join("")}</div>`;
}
function refsMD(refs) {
  return (refs || []).map(r => {
    const [at, label] = splitRef(r), p = parseRef(at);
    return `${p ? `[\`${at}\`](${codeHref(p, "md")})` : `\`${at}\``}${label ? " " + label : ""}`;
  }).join(" · ");
}
function contextHTML(q, report = false) {
  const c = q.context; if (!c) return "";
  const list = xs => `<ul>${xs.map(x => `<li>${inline(x.text)}${refsHTML(x.refs)}</li>`).join("")}</ul>`;
  const src = c.sources.map(s => `<li>${esc(s.label)}, <a href="${handoutHref(s.pages[0], report)}" target="_blank" rel="noopener">${pagesLabel(s.pages)}</a></li>`).join("");
  return `<details class="context"><summary>Handout context: ${esc(contextSummary(q))}</summary><div class="ctx">
    <div><div class="ctx-h">Where in the handout</div><ul>${src}</ul><div class="note">${esc(c.points)}</div></div>
    <div><div class="ctx-h">Provided by the starter code</div>${list(c.provided)}</div>
    <div><div class="ctx-h">The design decision</div><p>${inline(c.decision.text)}</p>${refsHTML(c.decision.refs)}</div>
    <div><div class="ctx-h">What you had to implement</div>${list(c.asked)}</div>
  </div></details>`;
}

// Inline markdown: code spans, bold, italics. Everything is escaped first. Code
// spans and bare paths that name a file in the repository become links.
function inline(s) {
  return String(s ?? "").split(/(`[^`]+`)/g).map(part => {
    if (/^`[^`]+`$/.test(part)) { const c = part.slice(1, -1); return refLink(leadingRef(c), `<code>${esc(c)}</code>`); }
    return esc(part).replace(BARE_REF, (_, pre, at) => pre + refLink(at, at)).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  }).join("");
}
function md(src) {
  const lines = String(src ?? "").replace(/\r/g, "").split("\n");
  let out = "", list = null, para = [];
  const flushPara = () => { if (para.length) { out += `<p>${inline(para.join(" "))}</p>`; para = []; } };
  const flushList = () => { if (list) { out += `<${list.tag}>${list.items.map(i => `<li>${inline(i)}</li>`).join("")}</${list.tag}>`; list = null; } };
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (/^```/.test(line)) {
      flushPara(); flushList();
      const buf = [];
      for (i++; i < lines.length && !/^```/.test(lines[i]); i++) buf.push(lines[i]);
      out += `<pre><code>${esc(buf.join("\n"))}</code></pre>`;
      continue;
    }
    const bullet = line.match(/^\s*[-*]\s+(.*)$/), num = line.match(/^\s*\d+[.)]\s+(.*)$/), head = line.match(/^#{1,4}\s+(.*)$/);
    if (bullet || num) {
      flushPara();
      const tag = bullet ? "ul" : "ol";
      if (!list || list.tag !== tag) { flushList(); list = { tag, items: [] }; }
      list.items.push((bullet || num)[1]);
    } else if (head) {
      flushPara(); flushList(); out += `<p><strong>${inline(head[1])}</strong></p>`;
    } else if (!line.trim()) {
      flushPara(); flushList();
    } else {
      flushList(); para.push(line.trim());
    }
  }
  flushPara(); flushList();
  return out;
}

// -------------------------------------------------------------------- api ----

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { "Content-Type": "application/json" } });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

// POST a JSON body and read the server's newline-delimited JSON events.
async function stream(path, body, signal, onEvent) {
  const res = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body), signal });
  if (!res.ok) { const d = await res.json().catch(() => ({})); throw new Error(d.error || `HTTP ${res.status}`); }
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf("\n")) >= 0) {
      const line = buf.slice(0, i); buf = buf.slice(i + 1);
      if (line.trim()) onEvent(JSON.parse(line));
    }
  }
  if (buf.trim()) onEvent(JSON.parse(buf));
}

// Autosave to quiz/.attempts/<id>.json, one request at a time.
let persistTimer = null, persistChain = Promise.resolve();
function persist(immediate) {
  clearTimeout(persistTimer);
  if (immediate) return doPersist();
  persistTimer = setTimeout(doPersist, 700);
  return persistChain;
}
function doPersist() {
  if (!state.attempt) return persistChain;
  state.attempt.updatedAt = now();
  const id = state.attempt.id;
  const body = JSON.stringify({ attempt: state.attempt, items: state.items });
  persistChain = persistChain
    .then(() => fetch(`/api/attempts/${id}`, { method: "PUT", headers: { "Content-Type": "application/json" }, body }))
    .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); setSync("ok"); })
    .catch(e => { console.warn("autosave failed", e); setSync("err"); });
  return persistChain;
}

// ----------------------------------------------------------------- grading --

function logActivity(qid, text) {
  const f = inflight[qid]; if (!f) return;
  f.log.push(text);
  const el = document.getElementById(`activity-${qid}`);
  if (el) el.innerHTML = activityHTML(qid);
}

async function submitAnswer(qid) {
  const item = itemFor(qid);
  const answer = (document.getElementById(`answer-${qid}`)?.value ?? item.answer).trim();
  const refs = (document.getElementById(`refs-${qid}`)?.value ?? item.refs).trim();
  if (!answer) { toast("Write an answer first."); return; }
  if (inflight[qid]) return;
  item.answer = answer; item.refs = refs; item.lastError = null;
  const seconds = stopTimer(qid);
  const ctl = new AbortController();
  inflight[qid] = { ctl, kind: "grade", log: [] };
  renderGradeArea(qid); renderRail(); persist();
  try {
    let got = null;
    await stream("/api/grade", { qid, answer, refs }, ctl.signal, ev => {
      if (ev.type === "activity") logActivity(qid, ev.text);
      else if (ev.type === "grade") got = ev;
      else if (ev.type === "error") throw new Error(ev.message);
    });
    if (!got) throw new Error("The grader stopped without a grade. Submit again.");
    item.submissions.push({
      answer, refs, at: now(), seconds, grade: got.grade,
      session_id: got.session_id, cost: got.cost, grader_seconds: got.seconds, thread: []
    });
  } catch (e) {
    if (e?.name !== "AbortError") { item.lastError = errMsg(e); toast(item.lastError); }
  }
  delete inflight[qid];
  persist(true);
  if (currentQid() === qid) renderQuestion();
  renderRail();
}

async function askFollowup(qid, text) {
  const item = itemFor(qid), sub = lastSub(item);
  text = String(text || "").trim();
  if (!text || !sub || inflight[qid]) return;
  sub.thread = sub.thread || [];
  sub.thread.push({ role: "user", content: text, at: now() });
  item.followDraft = "";
  const ctl = new AbortController();
  inflight[qid] = { ctl, kind: "followup", log: [], text: "" };
  renderThread(qid); renderRail();
  try {
    let reply = null;
    await stream("/api/followup", { qid, session_id: sub.session_id, message: text }, ctl.signal, ev => {
      const f = inflight[qid];
      if (ev.type === "activity") logActivity(qid, ev.text);
      else if (ev.type === "delta" && f) {
        f.text += ev.text;
        const el = document.getElementById(`stream-${qid}`);
        if (el) el.innerHTML = md(f.text);
      } else if (ev.type === "reply") reply = ev;
      else if (ev.type === "error") throw new Error(ev.message);
    });
    if (!reply) throw new Error("No reply came back. Send it again.");
    sub.thread.push({ role: "assistant", content: reply.text || inflight[qid].text, at: now(), cost: reply.cost });
    if (reply.session_id) sub.session_id = reply.session_id;
  } catch (e) {
    const partial = inflight[qid]?.text;
    if (partial) sub.thread.push({ role: "assistant", content: partial + "\n\n*(reply cut off)*", at: now() });
    else if (e?.name !== "AbortError") { sub.thread.pop(); toast(errMsg(e)); }
  }
  delete inflight[qid];
  persist(true);
  renderThread(qid); renderRail();
}

// ------------------------------------------------------------------ timers --

function startTimer(qid) {
  if (!timers[qid]) timers[qid] = { start: Date.now(), base: itemFor(qid).draftSeconds || 0 };
  else if (!timers[qid].start) timers[qid].start = Date.now();
}
function elapsed(qid) { const t = timers[qid]; return t ? t.base + (t.start ? (Date.now() - t.start) / 1000 : 0) : itemFor(qid).draftSeconds || 0; }
function stopTimer(qid) {
  const s = elapsed(qid);
  timers[qid] = { start: 0, base: 0 };
  itemFor(qid).draftSeconds = 0;
  return Math.round(s);
}
function pauseTimer(qid) {
  const t = timers[qid]; if (!t || !t.start) return;
  t.base = elapsed(qid); t.start = 0; itemFor(qid).draftSeconds = Math.round(t.base);
}
setInterval(() => {
  const qid = currentQid();
  const el = qid && document.getElementById(`timer-${qid}`);
  if (el) el.textContent = fmtSecs(elapsed(qid));
}, 1000);

// ---------------------------------------------------------------- attempts --

function newId() {
  const d = new Date(), p = n => String(n).padStart(2, "0");
  return `a-${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}-${Math.random().toString(36).slice(2, 6).padEnd(4, "0")}`;
}
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function startAttempt(mode, order) {
  if (!order) order = mode === "quick" ? shuffle(QUESTIONS.map(q => q.id)).slice(0, 5) : QUESTIONS.map(q => q.id);
  if (!order.length) { toast("Pick at least one question."); return; }
  state.attempt = { id: newId(), mode, order, startedAt: now(), updatedAt: now(), status: "in_progress", finishedAt: null, savedDir: null };
  state.items = {};
  for (const k of Object.keys(timers)) delete timers[k];
  persist(true);
  go("question", 0);
}
// Open an attempt; with qid, at that question, scrolled to try k (0-based).
async function openAttempt(id, qid, k) {
  try {
    const data = await api(`/api/attempts/${id}`);
    state.attempt = data.attempt; state.items = data.items || {};
    for (const key of Object.keys(timers)) delete timers[key];
    const i = qid ? state.attempt.order.indexOf(qid) : -1;
    if (i < 0) return go(state.attempt.status === "finished" ? "summary" : "question", 0);
    go("question", i);
    showTry(qid, Number(k));
  } catch (e) { toast(errMsg(e)); }
}
function showTry(qid, k) {
  const subs = itemFor(qid).submissions;
  let el;
  if (!subs.length) el = document.getElementById(`answer-${qid}`);
  else if (k >= 0 && k < subs.length - 1) {
    const hist = document.querySelector(`#grade-${qid} details.history`);
    el = document.getElementById(`try-${qid}-${k}`);
    if (hist) hist.open = true;
    if (el) el.open = true;
  } else el = document.querySelector(`#grade-${qid} > .result`);
  if (!el) return;
  el.scrollIntoView({ block: "start" });
  el.classList.add("flash");
  setTimeout(() => el.classList.remove("flash"), 1800);
}
function currentQid() { return state.view === "question" && state.attempt ? state.attempt.order[state.current] : null; }

function go(view, index) {
  const prev = currentQid();
  if (prev) { pauseTimer(prev); flushDraft(prev); }
  state.view = view;
  if (typeof index === "number") state.current = index;
  render();
  window.scrollTo(0, 0);
}
function flushDraft(qid) {
  const item = itemFor(qid);
  const a = document.getElementById(`answer-${qid}`), r = document.getElementById(`refs-${qid}`);
  if (a) item.answer = a.value;
  if (r) item.refs = r.value;
  persist();
}
async function finish() {
  state.attempt.status = "finished";
  state.attempt.finishedAt = now();
  await persist(true);
  go("summary");
}

// ------------------------------------------------------------------ export --

function avgScore(order, items) {
  const s = order.map(id => lastGrade(items[id])?.score).filter(Boolean);
  return s.length ? s.reduce((a, b) => a + b, 0) / s.length : null;
}
function quote(text) { return String(text || "").split("\n").map(l => "> " + l).join("\n"); }
function bullets(list) { return list.length ? list.map(x => `- ${x}`).join("\n") : "- (none)"; }

function toMarkdown() {
  const a = state.attempt, items = state.items;
  const avg = avgScore(a.order, items);
  const out = [];
  out.push(`# Assignment 1 oral quiz practice: ${fmtDate(a.startedAt)}`, "");
  out.push(`- Attempt: \`${a.id}\``);
  out.push(`- Mode: ${modeLabel(a.mode).toLowerCase()} (${a.order.length} questions)`);
  out.push(`- Started: ${a.startedAt}${a.finishedAt ? `; finished: ${a.finishedAt}` : ""}`);
  if (INFO) out.push(`- Graded against the working tree at \`${INFO.head}\`${INFO.package_changed ? " (with uncommitted changes in cs329z_hw1/)" : ""}; grader model: ${INFO.model}`);
  out.push(`- Average score: ${avg ? avg.toFixed(1) + " / 5" : "not graded"}`, "");
  out.push("| # | Question | Score | Tries |", "|---|---|---|---|");
  a.order.forEach((id, i) => { const it = items[id], g = lastGrade(it); out.push(`| ${i + 1} | ${QBY[id].title} (${QBY[id].tag}) | ${g ? g.score + "/5" : "-"} | ${it?.submissions?.length || 0} |`); });
  out.push("");
  a.order.forEach((id, i) => {
    const q = QBY[id], it = items[id] || { submissions: [] };
    out.push(`## ${i + 1}. ${q.title}`, "", `*${q.tag}*`, "", `**Question.** ${q.prompt}`, "");
    const c = q.context;
    if (c) {
      out.push(`<details><summary>Handout context: ${esc(contextSummary(q))}</summary>`, "");
      out.push(...c.sources.map(s => `- ${s.label}, [${pagesLabel(s.pages)}](${handoutHref(s.pages[0], true)})`), `- ${c.points}`, "");
      const withRefs = xs => bullets(xs.map(x => `${x.text}<br>${refsMD(x.refs)}`));
      out.push("**Provided by the starter code**", "", withRefs(c.provided), "");
      out.push("**The design decision**", "", c.decision.text, "", refsMD(c.decision.refs), "");
      out.push("**What you had to implement**", "", withRefs(c.asked), "", "</details>", "");
    }
    if (!it.submissions.length) {
      out.push(it.answer ? `### Draft (not submitted)\n\n${quote(it.answer)}\n` : "_Not answered._", "");
      return;
    }
    it.submissions.forEach((s, k) => {
      const g = s.grade, last = k === it.submissions.length - 1;
      out.push(`### ${it.submissions.length > 1 ? `Try ${k + 1}${last ? " (latest)" : ""}` : "Your answer"}${s.seconds ? ` · ${fmtSecs(s.seconds)}` : ""}`, "");
      out.push(quote(s.answer), "");
      out.push("**Code you pointed to:**", "", s.refs ? "```\n" + s.refs + "\n```" : "_none_", "");
      out.push(`**Grade: ${g.score}/5.** ${g.verdict}`, "");
      out.push("**What was right**", "", bullets(g.strengths), "");
      out.push("**Gaps**", "", bullets(g.gaps), "");
      if (g.code_check.length) {
        out.push("**Code reference check**", "", "| Cited | Status | Note |", "|---|---|---|");
        g.code_check.forEach(c => out.push(`| \`${c.cited.replace(/\|/g, "\\|")}\` | ${c.status} | ${c.note.replace(/\|/g, "\\|").replace(/\n/g, " ")} |`));
        out.push("");
      }
      if (g.missing_refs.length) out.push("**Code an examiner would expect you to point to**", "", bullets(g.missing_refs), "");
      out.push("**Suggestions**", "", bullets(g.suggestions), "");
      out.push("**A 5/5 answer**", "", quote(g.model_answer), "");
      if (s.thread?.length) {
        out.push("**Follow-up**", "");
        s.thread.forEach(t => out.push(`*${t.role === "user" ? "You" : "Grader"}:*`, "", t.content, ""));
      }
      out.push(`<sub>Grader session \`${s.session_id || "?"}\`${s.cost != null ? ` · ${fmtCost(s.cost)}` : ""}${s.grader_seconds ? ` · ${Math.round(s.grader_seconds)} s` : ""}</sub>`, "");
    });
  });
  return out.join("\n");
}

function reportHTML() {
  const css = document.getElementById("page-style").textContent;
  const a = state.attempt, items = state.items, avg = avgScore(a.order, items);
  const rows = a.order.map((id, i) => { const g = lastGrade(items[id]); return `<tr><td class="mono">${i + 1}</td><td><a href="#q-${id}">${esc(QBY[id].title)}</a></td><td>${g ? `<span class="chip ${scoreClass(g.score)}">${g.score}/5</span>` : `<span class="chip s0">–</span>`}</td><td>${g ? inline(g.verdict) : ""}</td></tr>`; }).join("");
  const sections = a.order.map((id, i) => {
    const q = QBY[id], it = items[id] || { submissions: [] }, subs = it.submissions || [];
    const body = subs.length ? subs.map((s, k) => `
      <h3>${subs.length > 1 ? `Try ${k + 1}` : "Your answer"}${s.seconds ? ` · ${fmtSecs(s.seconds)}` : ""}</h3>
      <blockquote class="answer md">${md(s.answer)}</blockquote>
      ${s.refs ? refsBlock(s.refs) : ""}
      ${gradeHTML(s, { openModel: true })}
      ${threadLogHTML(s.thread)}`).join("")
      : (it.answer ? `<p class="note">Draft, not submitted:</p><blockquote class="answer md">${md(it.answer)}</blockquote>` : `<p class="note">Not answered.</p>`);
    return `<section class="report-q" id="q-${id}"><div class="eyebrow">Question ${i + 1} · ${esc(q.tag)}</div><h2>${esc(q.title)}</h2><div class="ask"><p>${esc(q.prompt)}</p></div>${contextHTML(q, true)}${body}</section>`;
  }).join("");
  return reportLinks(`<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oral quiz practice · ${esc(fmtDate(a.startedAt))}</title>
${FONT_LINK}
<style>${css}</style></head>
<body><div class="shell report"><main class="main">
<div class="qhead"><div class="eyebrow">Attempt ${esc(a.id)} · ${esc(modeLabel(a.mode))}${INFO ? ` · graded against ${esc(INFO.head)}` : ""}</div><h2>Oral quiz practice, ${esc(fmtDate(a.startedAt))}</h2></div>
<div class="score-row ${avg ? scoreClass(Math.round(avg)) : "s0"}"><div class="big">${avg ? avg.toFixed(1) : "–"}<small>/5 average</small></div></div>
<div class="tbl-wrap"><table><thead><tr><th>#</th><th>Question</th><th>Score</th><th>Verdict</th></tr></thead><tbody>${rows}</tbody></table></div>
${sections}
</main></div></body></html>`);
}

async function saveToQuiz(btn) {
  const qid = currentQid();
  if (qid) { pauseTimer(qid); flushDraft(qid); }
  if (btn) btn.disabled = true;
  try {
    await persist(true);
    const res = await api(`/api/attempts/${state.attempt.id}/save`, {
      method: "POST", body: JSON.stringify({ markdown: toMarkdown(), html: reportHTML() })
    });
    state.attempt.savedDir = res.dir;
    toast(`Saved to ${res.dir}/`);
  } catch (e) { toast(errMsg(e)); }
  if (state.view === "summary") renderSummary(); else if (btn) btn.disabled = false;
}

async function copy(text, btn) {
  try { await navigator.clipboard.writeText(text); toast("Copied"); }
  catch { const el = btn?.previousElementSibling; if (el) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } toast("Press Cmd+C to copy"); }
}

// ------------------------------------------------------------------ render --

const app = document.getElementById("app");

function render() {
  if (state.view === "question" && state.attempt) return renderQuestionView();
  if (state.view === "summary" && state.attempt) return renderSummary();
  if (state.view === "samples") return renderSamples();
  return renderStart();
}
function setPill(id, mode, text) {
  const el = document.getElementById(id);
  el.className = "pill " + (mode === "ok" ? "on" : mode === "err" ? "off" : "");
  el.lastElementChild.textContent = text;
}
function setSync(mode) { setPill("pill-sync", mode, mode === "err" ? "Autosave failed: is the server running?" : "Autosave: quiz/.attempts"); }

let PAST = []; // attempt summaries from /api/attempts, newest first
const picked = new Set(); // question ids ticked for a custom quiz

// Every answer to each question across all attempts, newest first.
function answersByQuestion() {
  const by = {};
  for (const a of PAST) {
    for (const [qid, rows] of Object.entries(a.responses || {})) {
      rows.forEach((r, k) => (by[qid] ||= []).push({ ...r, id: a.id, mode: a.mode, qid, k, n: rows.length }));
    }
  }
  for (const list of Object.values(by)) list.sort((x, y) => String(y.at || "").localeCompare(String(x.at || "")));
  return by;
}
function answerLinks(list) {
  if (!list?.length) return "";
  return `<div class="toc-answers"><span>Your answers:</span>${list.map(r => {
    const chip = r.draft ? `<span class="chip s0">draft</span>` : r.score ? `<span class="chip ${scoreClass(r.score)}">${r.score}/5</span>` : `<span class="chip s0">–</span>`;
    const what = r.draft ? "unsubmitted draft" : `try ${r.k + 1} of ${r.n}`;
    return `<a href="#" class="ans" data-act="open" data-id="${esc(r.id)}" data-q="${esc(r.qid)}" data-k="${r.k}" title="${esc(`${modeLabel(r.mode)} ${r.id}, ${what}`)}">${chip}${esc(fmtDate(r.at))}</a>`;
  }).join("")}</div>`;
}
function customLabel() { return picked.size ? `Start a custom quiz with ${picked.size} question${picked.size > 1 ? "s" : ""}` : "Tick questions to build a custom quiz"; }
function syncPicks() {
  document.querySelectorAll("input[data-pick]").forEach(cb => { cb.checked = picked.has(cb.dataset.pick); });
  const b = document.getElementById("custom-start");
  if (b) { b.disabled = !picked.size; b.textContent = customLabel(); }
}

async function renderStart() {
  drawStart();
  try { PAST = (await api("/api/attempts")).attempts || []; } catch { return; }
  if (state.view === "start") drawStart();
}
function drawStart() {
  const answers = answersByQuestion();
  const past = PAST.length ? `<div><div class="section-h" style="margin-bottom:8px">Your attempts</div><div class="attempts">${PAST.slice(0, 10).map(a => {
    const sc = Object.values(a.scores || {}); const avg = sc.length ? (sc.reduce((x, y) => x + y, 0) / sc.length).toFixed(1) : null;
    return `<div class="attempt"><div><div>${esc(fmtDate(a.startedAt))} · ${esc(modeLabel(a.mode))}</div>
      <div class="meta">${sc.length} of ${a.order?.length || "?"} graded${avg ? ` · average ${avg}/5` : ""} · ${a.status === "finished" ? "finished" : "in progress"}${a.savedDir ? ` · saved in ${esc(a.savedDir)}/` : ""}</div></div>
      <div class="row"><button class="btn small" data-act="open" data-id="${esc(a.id)}">${a.status === "finished" ? "Review" : "Resume"}</button></div></div>`;
  }).join("")}</div></div>` : "";
  app.innerHTML = `
  <div class="main" style="max-width:820px">
    <section class="hero">
      <div class="eyebrow">&lt;tool_call&gt; {"name": "oral_quiz", "args": {"minutes": 10}} &lt;/tool_call&gt;</div>
      <h2>Explain your harness the way the TAs will ask.</h2>
      <p>There is one question for every problem box in the handout (Problems 1–14), plus the sandbox and the evaluation write-ups. Each one opens with the handout context: the problem and its page, what the starter code gave you, the design decision, and what you had to build, each with the files and lines it refers to. Answer in a few sentences and list the code you would point to on your laptop. Claude Code grades it 1 to 5 in this repository, reading your working tree${INFO ? ` (now at <code>${esc(INFO.head)}</code>)` : ""} to check every line you cite. Ask follow-ups on any grade, then save the session into <code>quiz/quizN/</code>.</p>
    </section>
    <div class="modes">
      <button class="mode" data-act="start" data-mode="full"><strong>Full practice</strong><span>All ${QUESTIONS.length} questions in handout order. About ${QUESTIONS.length * 2} minutes.</span></button>
      <button class="mode" data-act="start" data-mode="quick"><strong>Quick round</strong><span>5 of the ${QUESTIONS.length} questions, picked at random and shuffled, close to the real 10 minutes.</span></button>
      <button class="mode" data-act="to-list"><strong>Custom quiz</strong><span>Choose the questions yourself in the list below.</span></button>
      <button class="mode" data-act="samples"><strong>Sample answers</strong><span>A 5/5 answer to every question, with the code to point to. Read and edit them, or swap in your own once it is graded.</span></button>
    </div>
    ${past}
    <div class="section-h" id="all-questions">All questions</div>
    <div class="toc-bar">
      <button class="btn primary small" id="custom-start" data-act="custom" ${picked.size ? "" : "disabled"}>${customLabel()}</button>
      <button class="btn small ghost" data-act="pick-all">Select all</button>
      <button class="btn small ghost" data-act="pick-none">Clear</button>
      <span class="note">Each row links to your answers to that question in every attempt.</span>
    </div>
    <div class="toc">
      ${QUESTIONS.map((q, i) => `<div class="toc-row">
        <input type="checkbox" id="pick-${q.id}" data-pick="${q.id}" ${picked.has(q.id) ? "checked" : ""}>
        <span class="mono">${i + 1}</span>
        <label for="pick-${q.id}">${esc(q.title)}</label>
        <span class="mono toc-tag">${esc(q.tag)} · ${pagesLabel(q.context.sources[0].pages)} · <a href="#" class="toc-sample" data-act="samples" data-q="${q.id}">sample</a></span>
        ${answerLinks(answers[q.id])}
      </div>`).join("")}
    </div>
  </div>`;
}

function railHTML() {
  const a = state.attempt;
  const graded = a.order.filter(id => lastGrade(state.items[id])).length;
  return `<aside class="rail">
    <div class="rail-head"><span>${esc(modeLabel(a.mode))}</span><span class="mono">${graded}/${a.order.length}</span></div>
    <ol>${a.order.map((id, i) => {
      const q = QBY[id], g = lastGrade(state.items[id]), busy = inflight[id];
      const mark = busy ? `<span class="spin" aria-label="working"></span>` : g ? `<span class="chip ${scoreClass(g.score)}">${g.score}/5</span>` : `<span class="chip s0">–</span>`;
      const cur = state.view === "question" && state.current === i;
      return `<li><button class="rail-item" data-act="goto" data-i="${i}" aria-current="${cur}"><span class="num">${i + 1}</span><span class="t">${esc(q.title)}<span class="tag">${esc(q.tag.split(" · ")[0])}</span></span>${mark}</button></li>`;
    }).join("")}</ol>
    <div class="rail-foot">
      <button class="btn small ${state.view === "summary" ? "primary" : ""}" data-act="summary">${a.status === "finished" ? "Results and save" : "Finish and save"}</button>
      <button class="btn small ghost" data-act="home">All attempts</button>
    </div>
  </aside>`;
}
function renderRail() {
  const el = document.querySelector(".rail");
  if (el && state.attempt) el.outerHTML = railHTML();
}

function renderQuestionView() {
  app.innerHTML = `<div class="layout">${railHTML()}<main class="main" id="qmain"></main></div>`;
  renderQuestion();
}
function renderQuestion() {
  const qid = currentQid(); if (!qid) return;
  const q = QBY[qid], item = itemFor(qid), i = state.current, n = state.attempt.order.length;
  const last = lastSub(item);
  const main = document.getElementById("qmain"); if (!main) return;
  main.innerHTML = `
    <div class="qhead">
      <div class="eyebrow">Question ${i + 1} of ${n} · ${esc(q.tag)}</div>
      <h2>${esc(q.title)}</h2>
    </div>
    <div class="ask"><p>${esc(q.prompt)}</p></div>
    ${contextHTML(q)}
    <details class="hint"><summary>Hint: what an examiner expects you to cover</summary><ul>${q.hints.map(h => `<li>${esc(h)}</li>`).join("")}</ul></details>
    <div id="sample-q-${qid}">${sampleBlockHTML(qid)}</div>
    <div class="field">
      <label for="answer-${qid}"><span>${last ? "Your answer (edit and grade again to try again)" : "Your answer"}</span><span class="aux">⏱ <span id="timer-${qid}">${fmtSecs(elapsed(qid))}</span> · aim for about 60–90 s spoken</span></label>
      <textarea id="answer-${qid}" rows="7" placeholder="Say it the way you would to the TA: the decision, why you made it, and what it trades off.">${esc(item.answer)}</textarea>
    </div>
    <div class="field">
      <label for="refs-${qid}"><span>Where in the code</span><span class="aux">file:line or function, one per line</span></label>
      <textarea id="refs-${qid}" class="refs" rows="3" placeholder="cs329z_hw1/agent/session.py:221 (no-call branch in send)">${esc(item.refs)}</textarea>
    </div>
    <div class="row">
      <button class="btn primary" data-act="submit" data-q="${qid}" ${inflight[qid] ? "disabled" : ""}>${last ? "Grade again" : "Submit for grading"}</button>
      <span class="note">⌘/Ctrl + Enter</span>
      <span class="spacer"></span>
      ${i > 0 ? `<button class="btn ghost" data-act="goto" data-i="${i - 1}">Previous</button>` : ""}
      ${i < n - 1 ? `<button class="btn" data-act="goto" data-i="${i + 1}">Next question</button>` : `<button class="btn" data-act="summary">Finish and save</button>`}
    </div>
    <div id="grade-${qid}" class="grade-area"></div>
    <div id="thread-${qid}"></div>`;
  if (!last || item.answer !== last.answer) startTimer(qid);
  renderGradeArea(qid);
  renderThread(qid);
}

function activityHTML(qid) {
  const f = inflight[qid];
  if (!f) return "";
  const label = f.kind === "grade" ? (f.log.length ? "Checking your code" : "Starting Claude Code") : "Answering";
  return `<div class="live"><span class="spin"></span>${label}…</div>${f.log.slice(-8).map(l => `<div>› ${esc(l)}</div>`).join("")}`;
}

function gradeHTML(sub, opts = {}) {
  const g = sub.grade;
  const pips = [1, 2, 3, 4, 5].map(k => `<i class="${k <= g.score ? "on" : ""}"></i>`).join("");
  const list = (title, xs) => xs.length ? `<div class="block"><h3>${title}</h3><ul>${xs.map(x => `<li>${inline(x)}</li>`).join("")}</ul></div>` : "";
  const meta = [sub.cost != null ? fmtCost(sub.cost) : "", sub.grader_seconds ? `${Math.round(sub.grader_seconds)} s` : ""].filter(Boolean).join(" · ");
  return `<section class="result" aria-label="Grade">
    <div class="result-tag">&lt;tool_result name="<b>grader</b>" status="${g.score}/5"${sub.seconds ? ` time="${fmtSecs(sub.seconds)}"` : ""}&gt;</div>
    <div class="result-body">
      <div class="score-row ${scoreClass(g.score)}">
        <div class="big">${g.score}<small>/5</small></div>
        <div class="pips" aria-hidden="true">${pips}</div>
        <div class="verdict">${inline(g.verdict)}</div>
      </div>
      <div class="cols">${list("What was right", g.strengths)}${list("Gaps", g.gaps)}</div>
      ${g.code_check.length ? `<div class="block"><h3>Code reference check</h3><div class="tbl-wrap"><table><thead><tr><th>You cited</th><th>Check</th><th>What is there</th></tr></thead><tbody>
        ${g.code_check.map(c => `<tr><td class="mono">${refLink(leadingRef(c.cited), `<code>${esc(c.cited)}</code>`)}</td><td><span class="st ${c.status}">${c.status}</span></td><td>${inline(c.note)}</td></tr>`).join("")}
      </tbody></table></div></div>` : ""}
      <div class="cols">${list("Code to point to", g.missing_refs)}${list("To improve", g.suggestions)}</div>
      ${g.model_answer ? `<details class="model" ${opts.openModel ? "open" : ""}><summary>Show a 5/5 answer</summary><div class="md">${md(g.model_answer)}</div></details>` : ""}
    </div>
    <div class="result-tag end">&lt;/tool_result&gt;${meta ? ` · ${meta}` : ""}</div>
  </section>`;
}

// A finished follow-up thread, read-only (earlier tries and the saved report).
function threadLogHTML(thread) {
  if (!thread?.length) return "";
  return `<div class="thread">${thread.map(t => `<div class="msg ${t.role}"><div class="who">${t.role === "user" ? "You" : "Grader"}</div><div class="md">${md(t.content)}</div></div>`).join("")}</div>`;
}

function renderGradeArea(qid) {
  const el = document.getElementById(`grade-${qid}`); if (!el) return;
  const item = itemFor(qid), subs = item.submissions;
  const btn = document.querySelector(`[data-act="submit"][data-q="${qid}"]`); if (btn) btn.disabled = !!inflight[qid];
  let html = "";
  if (inflight[qid]?.kind === "grade") {
    html += `<div class="result"><div class="result-tag">&lt;tool_result name="<b>grader</b>" status="running"&gt;</div><div class="result-body"><div class="activity" id="activity-${qid}">${activityHTML(qid)}</div><div class="row"><button class="btn small" data-act="stop" data-q="${qid}">Stop</button></div></div></div>`;
  }
  if (subs.length) {
    html += gradeHTML(subs[subs.length - 1]) + useSampleHTML(qid, subs.length - 1);
    if (subs.length > 1) {
      html += `<details class="history" id="history-${qid}"><summary>Earlier tries (${subs.length - 1})</summary>${subs.slice(0, -1).map((s, k) => `<details class="past" id="try-${qid}-${k}">
        <summary><span class="chip ${scoreClass(s.grade.score)}">${s.grade.score}/5</span> Try ${k + 1} · ${esc(fmtDate(s.at))}${s.thread?.length ? ` · ${s.thread.length} follow-up messages` : ""} · ${inline(s.grade.verdict)}</summary>
        <div><blockquote class="answer md">${md(s.answer)}</blockquote>${s.refs ? refsBlock(s.refs) : ""}${gradeHTML(s)}${useSampleHTML(qid, k)}${threadLogHTML(s.thread)}</div>
      </details>`).join("")}</details>`;
    }
  } else if (item.lastError && !inflight[qid]) {
    html += `<p class="warn">${esc(item.lastError)}</p>`;
  }
  // Redrawing keeps open whatever was unfolded (earlier tries, the sample).
  const open = new Set([...el.querySelectorAll("details[open][id]")].map(d => d.id));
  el.innerHTML = html;
  open.forEach(id => { const d = document.getElementById(id); if (d) d.open = true; });
}

function renderThread(qid) {
  const el = document.getElementById(`thread-${qid}`); if (!el) return;
  const item = itemFor(qid), sub = lastSub(item);
  if (!sub) { el.innerHTML = ""; return; }
  const busy = inflight[qid]?.kind === "followup";
  const draft = document.getElementById(`followup-${qid}`)?.value ?? item.followDraft ?? "";
  el.innerHTML = `<section class="thread">
    <h3>Ask about this feedback</h3>
    ${(sub.thread || []).map(t => `<div class="msg ${t.role}"><div class="who">${t.role === "user" ? "You" : "Grader"}</div><div class="md">${md(t.content)}</div></div>`).join("")}
    ${busy ? `<div class="msg assistant"><div class="who">Grader</div><div class="md" id="stream-${qid}">${inflight[qid].text ? md(inflight[qid].text) : `<div class="activity" id="activity-${qid}">${activityHTML(qid)}</div>`}</div><div class="row" style="margin-top:6px"><button class="btn small ghost" data-act="stop" data-q="${qid}">Stop</button></div></div>` : ""}
    <div class="chips">${CHIPS.map(c => `<button class="chip-btn" data-act="chip" data-q="${qid}" ${busy ? "disabled" : ""}>${esc(c)}</button>`).join("")}</div>
    <div class="compose">
      <textarea id="followup-${qid}" rows="2" placeholder="Ask a follow-up, or answer the grader's question">${esc(draft)}</textarea>
      <button class="btn primary" data-act="ask" data-q="${qid}" ${busy ? "disabled" : ""}>Send</button>
    </div>
  </section>`;
}

function renderSummary() {
  const a = state.attempt, items = state.items;
  const avg = avgScore(a.order, items);
  const weak = a.order.filter(id => { const g = lastGrade(items[id]); return !g || g.score <= 3; });
  const cost = a.order.flatMap(id => (items[id]?.submissions || []).flatMap(s => [s.cost, ...(s.thread || []).map(t => t.cost)])).filter(c => typeof c === "number").reduce((x, y) => x + y, 0);
  app.innerHTML = `<div class="layout">${railHTML()}<main class="main">
    <div class="qhead"><div class="eyebrow">${a.status === "finished" ? "Finished " + esc(fmtDate(a.finishedAt)) : "In progress"} · attempt ${esc(a.id)}</div><h2>Results</h2></div>
    <div class="score-row ${avg ? scoreClass(Math.round(avg)) : "s0"}">
      <div class="big">${avg ? avg.toFixed(1) : "–"}<small>/5 average</small></div>
      <div class="note" style="flex:1 1 240px">${a.order.filter(id => lastGrade(items[id])).length} of ${a.order.length} questions graded.${weak.length ? ` ${weak.length} at 3 or below, or not graded.` : " Every question at 4 or 5."}${cost ? ` Grading cost about ${fmtCost(cost)}.` : ""}</div>
    </div>
    <div class="tbl-wrap"><table><thead><tr><th>#</th><th>Question</th><th>Score</th><th>Tries</th><th>Verdict</th></tr></thead><tbody>
      ${a.order.map((id, i) => { const g = lastGrade(items[id]); return `<tr><td class="mono">${i + 1}</td><td><a href="#" data-act="goto" data-i="${i}">${esc(QBY[id].title)}</a></td><td>${g ? `<span class="chip ${scoreClass(g.score)}">${g.score}/5</span>` : `<span class="chip s0">–</span>`}</td><td class="mono">${items[id]?.submissions?.length || 0}</td><td>${g ? inline(g.verdict) : ""}</td></tr>`; }).join("")}
    </tbody></table></div>
    <div class="row">
      ${a.status !== "finished" ? `<button class="btn" data-act="finish">Mark finished</button>` : ""}
      ${weak.length ? `<button class="btn" data-act="retake">Retake the ${weak.length} weakest</button>` : ""}
    </div>
    <section class="block">
      <h3>Save to quiz/</h3>
      <div class="row"><button class="btn primary" data-act="save">${a.savedDir ? `Save again to ${esc(a.savedDir)}/` : "Save to quiz/"}</button>
        ${a.savedDir ? `<span class="copyline"><code>${esc(a.savedDir)}/index.html</code><button class="btn small" data-act="copy" data-text="${esc(a.savedDir + "/index.html")}">Copy path</button></span>` : ""}</div>
      <p class="note">Writes ${a.savedDir ? `<code>${esc(a.savedDir)}/</code>` : "the next empty <code>quiz/quizN/</code>"}: <code>quiz.md</code> (every question, your answers, each grade and code check, the 5/5 answers and the follow-ups), <code>quiz.json</code> (the same as data, with the rubric), and <code>index.html</code> (a static copy of these results you can open without the server).</p>
    </section>
  </main></div>`;
}

// ---------------------------------------------------------------- samples --
// One sample answer per question, kept in quiz/samples/<qid>.md. The Sample
// answers view shows and edits them; under each graded try a button makes that
// try the sample (it asks first when it would replace one).

let SAMPLES = {}; // qid -> {answer, refs, source, updated}
const sampleEdit = {}; // qid -> {answer, refs}: the editor is open with these drafts
let samplePick = null; // {qid, k}: the try waiting for "Replace"

async function saveSample(qid, answer, refs, source) {
  const res = await api(`/api/samples/${qid}`, { method: "PUT", body: JSON.stringify({ answer, refs, source }) });
  return (SAMPLES[qid] = res.sample);
}
function sampleBodyHTML(qid) {
  const s = SAMPLES[qid];
  if (!s) return `<p class="note">No sample answer yet.</p>`;
  return `<div class="md">${md(s.answer)}</div>${s.refs ? refsBlock(s.refs) : ""}`;
}
function sampleSourceHTML(qid) {
  const s = SAMPLES[qid];
  return s ? `<span class="note">${esc(s.source || "No source noted")}${s.updated ? ` · saved ${esc(fmtDate(s.updated))}` : ""}</span>` : "";
}

async function renderSamples() {
  drawSamples();
  try { SAMPLES = (await api("/api/samples")).samples || {}; } catch { return; }
  if (state.view === "samples") drawSamples();
}
function drawSamples() {
  const back = state.attempt && state.samplesBack;
  app.innerHTML = `<div class="main" style="max-width:820px">
    <div class="row">${back ? `<button class="btn small" data-act="samples-back">Back to question ${back.current + 1}</button>` : ""}<button class="btn small ghost" data-act="home">All attempts</button></div>
    <section class="hero">
      <h2>Sample answers</h2>
      <p>A 5/5 answer to every question, the way you might say it to the TA, with the code to point to. Edit any of them here or in <code>quiz/samples/</code> (one Markdown file per question). After a grade, “Make this my sample answer” swaps in your own.</p>
    </section>
    <nav class="samples-nav">${QUESTIONS.map((q, i) => `<a href="#sample-${q.id}">${i + 1}. ${esc(q.title)}</a>`).join("")}</nav>
    ${QUESTIONS.map((q, i) => sampleCardHTML(q, i)).join("")}
  </div>`;
  if (state.sampleFocus) {
    document.getElementById(`sample-${state.sampleFocus}`)?.scrollIntoView({ block: "start" });
    state.sampleFocus = null;
  }
}
function sampleCardHTML(q, i) {
  const ed = sampleEdit[q.id];
  const body = ed ? `
    <div class="field"><label for="sample-answer-${q.id}"><span>Sample answer</span><span class="aux">markdown</span></label>
      <textarea id="sample-answer-${q.id}" rows="12">${esc(ed.answer)}</textarea></div>
    <div class="field"><label for="sample-refs-${q.id}"><span>Code to point to</span><span class="aux">file:line and a label, one per line</span></label>
      <textarea id="sample-refs-${q.id}" class="refs" rows="6">${esc(ed.refs)}</textarea></div>
    <div class="row"><button class="btn primary small" data-act="sample-save" data-q="${q.id}">Save</button><button class="btn small ghost" data-act="sample-cancel" data-q="${q.id}">Cancel</button><span class="note">⌘/Ctrl + Enter saves</span></div>`
    : `${sampleBodyHTML(q.id)}
    <div class="row">${sampleSourceHTML(q.id)}<span class="spacer"></span>
      <button class="btn small" data-act="sample-edit" data-q="${q.id}">${SAMPLES[q.id] ? "Edit" : "Write one"}</button>
      <button class="btn small ghost" data-act="practice" data-q="${q.id}">Practice this question</button></div>`;
  return `<section class="sample-card" id="sample-${q.id}">
    <div class="eyebrow">${i + 1} · ${esc(q.tag)}</div><h2>${esc(q.title)}</h2>
    <div class="ask"><p>${esc(q.prompt)}</p></div>${body}</section>`;
}
function redrawSampleCard(qid) {
  const el = document.getElementById(`sample-${qid}`), i = QUESTIONS.findIndex(q => q.id === qid);
  if (el && i >= 0) el.outerHTML = sampleCardHTML(QUESTIONS[i], i);
}
async function submitSampleEdit(qid) {
  const ed = sampleEdit[qid]; if (!ed) return;
  if (!ed.answer.trim()) { toast("The sample answer is empty."); return; }
  const base = (SAMPLES[qid]?.source || "Written by you").replace(/ · edited by you$/, "");
  try {
    await saveSample(qid, ed.answer, ed.refs, `${base} · edited by you`);
    delete sampleEdit[qid];
    toast(`Saved quiz/samples/${qid}.md`);
  } catch (e) { toast(errMsg(e)); }
  redrawSampleCard(qid);
}

// Under a graded try, the button that makes it the sample. The sample itself is
// folded under the hint, so it can be read before or after answering.
function useSampleHTML(qid, k) {
  if (samplePick?.qid === qid && samplePick.k === k) {
    return `<div class="row confirm"><span>Replace the current sample answer with this try?</span>
      <button class="btn primary small" data-act="sample-use" data-q="${qid}" data-k="${k}">Replace</button>
      <button class="btn small ghost" data-act="sample-keep" data-q="${qid}">Keep the sample</button></div>`;
  }
  return `<div class="row"><button class="btn small" data-act="sample-pick" data-q="${qid}" data-k="${k}">Make this my sample answer</button></div>`;
}
function sampleBlockHTML(qid, open = false) {
  return `<details class="hint sample" ${open ? "open" : ""}><summary>Sample answer: a 5/5 answer and the code to point to</summary>${sampleBodyHTML(qid)}
    <div class="row">${sampleSourceHTML(qid)}<span class="spacer"></span><button class="btn small ghost" data-act="samples" data-q="${qid}" data-edit="1">Edit in Sample answers</button></div></details>`;
}
async function useAsSample(qid, k) {
  const a = state.attempt, s = itemFor(qid).submissions[k];
  samplePick = null;
  if (!s) return renderGradeArea(qid);
  const source = `Your answer: try ${k + 1} in ${modeLabel(a.mode).toLowerCase()} ${a.id}, graded ${s.grade.score}/5 on ${fmtDate(s.at)}`;
  try {
    await saveSample(qid, s.answer, s.refs || "", source);
    toast(`This try is now the sample answer (quiz/samples/${qid}.md)`);
  } catch (e) { toast(errMsg(e)); }
  renderGradeArea(qid);
  const el = document.getElementById(`sample-q-${qid}`); if (el) el.innerHTML = sampleBlockHTML(qid, true);
}

// ------------------------------------------------------------------ events --

app.addEventListener("click", e => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  const act = t.dataset.act, qid = t.dataset.q;
  if (t.tagName === "A") e.preventDefault();
  if (act === "start") return startAttempt(t.dataset.mode);
  if (act === "goto") return go("question", Number(t.dataset.i));
  if (act === "summary") return go("summary");
  if (act === "home") { const q = currentQid(); if (q) { pauseTimer(q); flushDraft(q); } state.view = "start"; return render(); }
  if (act === "submit") return submitAnswer(qid);
  if (act === "stop") { inflight[qid]?.ctl.abort(); return; }
  if (act === "chip") return askFollowup(qid, t.textContent);
  if (act === "ask") { const ta = document.getElementById(`followup-${qid}`); const v = ta.value; ta.value = ""; return askFollowup(qid, v); }
  if (act === "finish") return finish();
  if (act === "save") return saveToQuiz(t);
  if (act === "copy") return copy(t.dataset.text, t);
  if (act === "retake") {
    const weak = state.attempt.order.filter(id => { const g = lastGrade(state.items[id]); return !g || g.score <= 3; });
    return startAttempt("retake", weak);
  }
  if (act === "open") return openAttempt(t.dataset.id, qid, t.dataset.k);
  if (act === "to-list") { document.getElementById("all-questions")?.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  if (act === "custom") return startAttempt("custom", QUESTIONS.map(q => q.id).filter(id => picked.has(id)));
  if (act === "samples") {
    const cur = currentQid(); if (cur) { pauseTimer(cur); flushDraft(cur); }
    state.samplesBack = state.view === "question" || state.view === "summary" ? { view: state.view, current: state.current } : null;
    if (qid && t.dataset.edit && !sampleEdit[qid]) sampleEdit[qid] = { answer: SAMPLES[qid]?.answer || "", refs: SAMPLES[qid]?.refs || "" };
    state.view = "samples"; state.sampleFocus = qid || null;
    if (!qid) window.scrollTo(0, 0);
    return render();
  }
  if (act === "samples-back") return go(state.samplesBack.view, state.samplesBack.current);
  if (act === "practice") return startAttempt("custom", [qid]);
  if (act === "sample-edit") {
    sampleEdit[qid] = { answer: SAMPLES[qid]?.answer || "", refs: SAMPLES[qid]?.refs || "" };
    redrawSampleCard(qid); document.getElementById(`sample-answer-${qid}`)?.focus(); return;
  }
  if (act === "sample-cancel") { delete sampleEdit[qid]; return redrawSampleCard(qid); }
  if (act === "sample-save") return submitSampleEdit(qid);
  if (act === "sample-pick") {
    const k = Number(t.dataset.k);
    if (!SAMPLES[qid]) return useAsSample(qid, k);
    samplePick = { qid, k }; return renderGradeArea(qid);
  }
  if (act === "sample-use") return useAsSample(qid, Number(t.dataset.k));
  if (act === "sample-keep") { samplePick = null; return renderGradeArea(qid); }
  if (act === "pick-all") { QUESTIONS.forEach(q => picked.add(q.id)); return syncPicks(); }
  if (act === "pick-none") { picked.clear(); return syncPicks(); }
});
app.addEventListener("change", e => {
  const id = e.target.dataset?.pick; if (!id) return;
  if (e.target.checked) picked.add(id); else picked.delete(id);
  syncPicks();
});
app.addEventListener("input", e => {
  const sm = (e.target.id || "").match(/^sample-(answer|refs)-(.+)$/);
  if (sm) { if (sampleEdit[sm[2]]) sampleEdit[sm[2]][sm[1]] = e.target.value; return; }
  const m = (e.target.id || "").match(/^(answer|refs|followup)-(.+)$/); if (!m) return;
  const item = itemFor(m[2]);
  if (m[1] === "answer") { item.answer = e.target.value; startTimer(m[2]); persist(); }
  else if (m[1] === "refs") { item.refs = e.target.value; persist(); }
  else item.followDraft = e.target.value;
});
app.addEventListener("keydown", e => {
  if (e.key !== "Enter" || !(e.metaKey || e.ctrlKey)) return;
  const id = e.target.id || "";
  let m = id.match(/^sample-(answer|refs)-(.+)$/);
  if (m) { e.preventDefault(); return submitSampleEdit(m[2]); }
  m = id.match(/^(answer|refs)-(.+)$/);
  if (m) { e.preventDefault(); return submitAnswer(m[2]); }
  m = id.match(/^followup-(.+)$/);
  if (m) { e.preventDefault(); const v = e.target.value; e.target.value = ""; askFollowup(m[1], v); }
});
addEventListener("pagehide", () => {
  const q = currentQid(); if (q) pauseTimer(q);
  if (!state.attempt) return;
  // Best effort: keepalive lets the last autosave finish while the tab closes.
  fetch(`/api/attempts/${state.attempt.id}`, { method: "PUT", keepalive: true, headers: { "Content-Type": "application/json" }, body: JSON.stringify({ attempt: state.attempt, items: state.items }) }).catch(() => {});
});

// -------------------------------------------------------------------- boot --

(async function boot() {
  try {
    const [bank, info, samples] = await Promise.all([api("/api/questions"), api("/api/info"), api("/api/samples").catch(() => ({}))]);
    SAMPLES = samples.samples || {};
    QUESTIONS = bank.questions; CHIPS = bank.chips; INFO = info; HANDOUT = bank.handout || HANDOUT;
    setFiles(info.files || []);
    QBY = Object.fromEntries(QUESTIONS.map(q => [q.id, q]));
    setPill("pill-grader", "ok", `Grader: Claude Code · ${info.model} · repo at ${info.head}${info.package_changed ? "+changes" : ""}`);
    setSync("ok");
  } catch (e) {
    setPill("pill-grader", "err", "Grader: server not running");
    app.innerHTML = `<p class="warn">The quiz server is not answering. In the repository, run <code>python3 quiz/app/server.py</code> and open the address it prints.</p>`;
    return;
  }
  render();
})();
</script>
